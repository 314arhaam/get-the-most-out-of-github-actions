name: Testing k8s

on:
  workflow_dispatch:

jobs:

  jumpbox:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: dev/k8s
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: KTHW step 2
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 02-jumpbox.sh
        sudo ./02-jumpbox.sh
    - name: KTHW step 3
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 03-compute-resources.sh
        sudo ./03-compute-resources.sh
    - name: KTHW step 4
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 04-certificate-authority.sh #05-kubernetes-configuration-files
        sudo ./04-certificate-authority.sh
    - name: KTHW step 5
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 05-kubernetes-configuration-files.sh
        sudo ./05-kubernetes-configuration-files.sh
    - name: KTHW step 6
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 06-data-encryption-keys.sh
        sudo ./06-data-encryption-keys.sh
    - name: KTHW step 7
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 07-bootstrapping-etcd.sh
        sudo ./07-bootstrapping-etcd.sh
    - name: KTHW step 8
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 08-bootstrapping-kubernetes-controllers.sh
        sudo ./08-bootstrapping-kubernetes-controllers.sh
    - name: KTHW step 9
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 09-bootstrapping-kubernetes-workers.sh
        sudo ./09-bootstrapping-kubernetes-workers.sh
    - name: KTHW step 10
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 10-configuring-kubectl.sh
        sudo ./10-configuring-kubectl.sh
    - name: KTHW step 11
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 11-pod-network-routes.sh
        sudo ./11-pod-network-routes.sh
    - name: Check kubelet on node-0
      shell: bash
      run: |
        sudo ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          root@node-0 \
          "systemctl status kubelet --no-pager -l"
    - name: kubectl test
      run: |
        kubectl --version
        kubectl get nodes -o wide
    - name: echo date only
      run: |
        while true; do
          echo $(date);
          sleep 5;
        done
  
  server:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: dev/k8s
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: echo date only
      run: |
        while true; do
          echo $(date);
          sleep 5;
        done
  
  node-0:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: dev/k8s
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: echo date only
      run: |
        while true; do
          echo $(date);
          sleep 5;
        done
  
  node-1:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: dev/k8s
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: echo date only
      run: |
        while true; do
          echo $(date);
          sleep 5;
        done