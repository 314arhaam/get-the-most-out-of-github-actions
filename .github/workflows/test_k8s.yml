name: Testing k8s

on:
  workflow_dispatch:

jobs:

  jumpbox:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: dev/k8s
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: KTHW step 2
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 02-jumpbox.sh
        sudo ./02-jumpbox.sh
    - name: echo date only
      run: |
        while true; do
          echo $(date);
          sleep 5;
        done
  
