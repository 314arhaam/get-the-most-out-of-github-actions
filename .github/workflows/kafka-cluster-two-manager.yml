name: Multi Contoller Kafka cluster across GitHub-hosted runners

on:
  workflow_dispatch:

# Every job below runs on a different GitHub-hosted VM. Tailscale supplies the
# private network that lets the Kafka processes communicate between those VMs.
permissions:
  contents: read

env:
  KAFKA_IMAGE: apache/kafka:3.9.0
  # This value must be identical on every KRaft node in a cluster.
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

jobs:

  redis-service:
    name: Redis lifecycle coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Connect Redis to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: redis-server-ts

      - name: Register the Redis coordinator
        run: docker exec ${{ job.services.redis.id }} redis-cli SET redis-service ready

      - name: Keep Redis online until verification finishes
        shell: bash
        run: |
          while [ "$(docker exec ${{ job.services.redis.id }} redis-cli GET redis-service)" = "ready" ]; do
            sleep 2
          done


  check-redis-service:
    name: Check Redis service
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: check-redis-service

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Wait for Redis
        shell: bash
        run: |
          MAX_RETRIES=60
          COUNT=0
          REDIS_HOST="redis-server-ts"

          while true; do
            REDIS_HOST="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"

            if [ -n "$REDIS_HOST" ]; then
              echo "Checking Redis at ${REDIS_HOST}:6379..."
              RESPONSE="$(redis-cli -h "$REDIS_HOST" -p 6379 ping 2>/dev/null || true)"

              if [ "$RESPONSE" = "PONG" ]; then
                echo "Redis is available."
                break
              fi
            fi

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Timeout waiting for Redis."
              exit 1
            fi

            echo "Redis is not available yet. ($COUNT/$MAX_RETRIES)"
            sleep 2
          done



  kafka-controller-1:
    name: Kafka controller 1 (KRaft controller)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-redis-service

    steps:
      - name: Connect controller 1 to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-controller-1

      - name: Install the Redis client
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Start KRaft controller 1
        shell: bash
        run: |
          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          until redis-cli -h "$redis_host" ping | grep -qx PONG; do
            sleep 2
          done

          controller_1_ip="$(tailscale ip -4)"
          redis-cli -h "$redis_host" SET kafka-controller-1-ip "$controller_1_ip"

          until [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-2-ip)" ]; do
            sleep 2
          done

          controller_2_ip="$(redis-cli -h "$redis_host" GET kafka-controller-2-ip)"

          docker run --detach --name kafka-controller-1 --restart unless-stopped \
            --network host \
            --env CLUSTER_ID \
            --env KAFKA_NODE_ID=1 \
            --env KAFKA_PROCESS_ROLES=controller \
            --env KAFKA_LISTENERS="CONTROLLER://${controller_1_ip}:9093" \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS="1@${controller_1_ip}:9093,2@${controller_2_ip}:9093" \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_LOG_DIRS=/tmp/kraft-controller-logs \
            "$KAFKA_IMAGE"

      - name: Wait for controller 1 quorum
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec kafka-controller-1 /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller "$(tailscale ip -4):9093" describe --status; then
              exit 0
            fi
            sleep 2
          done

          docker logs kafka-controller-1
          exit 1

      - name: Register controller 1 and wait for verification
        shell: bash
        run: |
          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          redis-cli -h "$redis_host" SET kafka-controller-1 "$(tailscale ip -4)"

          while [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-1)" ]; do
            sleep 2
          done


  kafka-controller-2:
    name: Kafka controller 2 (KRaft controller)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-redis-service

    steps:
      - name: Connect controller 2 to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-controller-2

      - name: Install the Redis client
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Start KRaft controller 2
        shell: bash
        run: |
          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          until redis-cli -h "$redis_host" ping | grep -qx PONG; do
            sleep 2
          done

          controller_2_ip="$(tailscale ip -4)"
          redis-cli -h "$redis_host" SET kafka-controller-2-ip "$controller_2_ip"

          until [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-1-ip)" ]; do
            sleep 2
          done

          controller_1_ip="$(redis-cli -h "$redis_host" GET kafka-controller-1-ip)"

          docker run --detach --name kafka-controller-2 --restart unless-stopped \
            --network host \
            --env CLUSTER_ID \
            --env KAFKA_NODE_ID=2 \
            --env KAFKA_PROCESS_ROLES=controller \
            --env KAFKA_LISTENERS="CONTROLLER://${controller_2_ip}:9093" \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS="1@${controller_1_ip}:9093,2@${controller_2_ip}:9093" \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_LOG_DIRS=/tmp/kraft-controller-logs \
            "$KAFKA_IMAGE"

      - name: Wait for controller 2 quorum
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec kafka-controller-2 /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller "$(tailscale ip -4):9093" describe --status; then
              exit 0
            fi
            sleep 2
          done

          docker logs kafka-controller-2
          exit 1

      - name: Register controller 2 and wait for verification
        shell: bash
        run: |
          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          redis-cli -h "$redis_host" SET kafka-controller-2 "$(tailscale ip -4)"

          while [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-2)" ]; do
            sleep 2
          done


  check-kafka-controller:
    name: Check Kafka controllers
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: check-kafka-controllers

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Wait for both Kafka controllers
        shell: bash
        run: |
          MAX_RETRIES=120
          COUNT=0
          REDIS_HOST=""

          while [ -z "$REDIS_HOST" ]; do
            REDIS_HOST="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$REDIS_HOST" ] || sleep 2
          done

          while true; do
            controller_1_IP="$(redis-cli -h "$REDIS_HOST" GET kafka-controller-1-ip 2>/dev/null || true)"
            controller_2_IP="$(redis-cli -h "$REDIS_HOST" GET kafka-controller-2-ip 2>/dev/null || true)"

            controller_1_ready=false
            controller_2_ready=false

            if [ -n "$controller_1_IP" ] && timeout 2 bash -c "</dev/tcp/${controller_1_IP}/9093"; then
              controller_1_ready=true
            fi

            if [ -n "$controller_2_IP" ] && timeout 2 bash -c "</dev/tcp/${controller_2_IP}/9093"; then
              controller_2_ready=true
            fi

            if [ "$controller_1_ready" = true ] && [ "$controller_2_ready" = true ]; then
              echo "Kafka controller 1 is reachable at ${controller_1_IP}:9093."
              echo "Kafka controller 2 is reachable at ${controller_2_IP}:9093."
              break
            fi

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Timeout waiting for both Kafka controllers."
              exit 1
            fi

            echo "Kafka controllers are not both available yet. ($COUNT/$MAX_RETRIES)"
            sleep 2
          done


  kafka-worker-1:
    name: Kafka worker 1 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-controller

    steps: &worker_steps
      - name: Connect the worker to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ github.job }}

      - name: Install the Redis client
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Start broker, register it, and wait for verification
        shell: bash
        run: |
          broker_name="${{ github.job }}"
          node_id="$(( ${broker_name##*-} + 2 ))"

          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          until redis-cli -h "$redis_host" ping | grep -qx PONG; do
            sleep 2
          done

          until [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-1-ip)" ] && \
                [ -n "$(redis-cli -h "$redis_host" GET kafka-controller-2-ip)" ]; do
            sleep 2
          done

          controller_1_ip="$(redis-cli -h "$redis_host" GET kafka-controller-1-ip)"
          controller_2_ip="$(redis-cli -h "$redis_host" GET kafka-controller-2-ip)"
          worker_ip="$(tailscale ip -4)"

          docker run --detach --name "$broker_name" --restart unless-stopped \
            --network host \
            --env CLUSTER_ID \
            --env KAFKA_NODE_ID="$node_id" \
            --env KAFKA_PROCESS_ROLES=broker \
            --env KAFKA_LISTENERS=PLAINTEXT://:9092 \
            --env KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${worker_ip}:9092" \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS="1@${controller_1_ip}:9093,2@${controller_2_ip}:9093" \
            --env KAFKA_LOG_DIRS=/tmp/kraft-broker-logs \
            --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
            --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
            --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
            --env KAFKA_MIN_INSYNC_REPLICAS=2 \
            "$KAFKA_IMAGE"

          broker_ready=false

          for attempt in {1..120}; do
            if docker exec "$broker_name" /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092; then
              broker_ready=true
              break
            fi
            sleep 2
          done

          if [ "$broker_ready" != true ]; then
            docker logs "$broker_name"
            exit 1
          fi

      - name: Register worker and wait for verification
        shell: bash
        run: |
          broker_name="${{ github.job }}"
          redis_host="redis-server-ts"

          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          redis-cli -h "$redis_host" SET "$broker_name" "$(tailscale ip -4)"

          while [ -n "$(redis-cli -h "$redis_host" GET "$broker_name")" ]; do
            sleep 2
          done


  kafka-worker-2:
    name: Kafka worker 2 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-controller
    steps: *worker_steps


  kafka-worker-3:
    name: Kafka worker 3 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-controller
    steps: *worker_steps


  # ================================================================
  # NEW: BROKER VERIFIER
  # ================================================================

  verify-kafka-cluster:
    name: Verify Kafka cluster and release jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Connect the verifier to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-verifier

      - name: Install Redis and Kafka clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools kcat

      - name: Wait for every Kafka node to register
        shell: bash
        run: |
          required_keys=(redis-service kafka-controller-1 kafka-controller-2 kafka-worker-1 kafka-worker-2 kafka-worker-3)
          redis_host="redis-server-ts"
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          until redis-cli -h "$redis_host" ping | grep -qx PONG; do sleep 2; done

          while true; do
            ready=0
            for key in "${required_keys[@]}"; do
              ready=$((ready + $(redis-cli -h "$redis_host" EXISTS "$key")))
            done
            [ "$ready" -eq "${#required_keys[@]}" ] && break
            sleep 2
          done

      - name: Ping the Kafka cluster
        shell: bash
        run: |
          redis_host="redis-server-ts"
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done

          controller_1_ip="$(redis-cli -h "$redis_host" GET kafka-controller-1-ip)"
          controller_2_ip="$(redis-cli -h "$redis_host" GET kafka-controller-2-ip)"

          tailscale ping --timeout=5s kafka-controller-1
          tailscale ping --timeout=5s kafka-controller-2
          timeout 2 bash -c "</dev/tcp/${controller_1_ip}/9093"
          timeout 2 bash -c "</dev/tcp/${controller_2_ip}/9093"

          echo "Both Kafka controllers are connected and reachable."

          for broker in kafka-worker-1 kafka-worker-2 kafka-worker-3; do
            broker_ip="$(redis-cli -h "$redis_host" GET "$broker")"
            kcat -b "${broker_ip}:9092" -L
          done

  # ================================================================
  # KAFKA MONITORING
  # ================================================================

  kafka-monitoring:
    name: Kafka monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs: verify-kafka-cluster

    steps:
      - name: Connect monitoring to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-monitoring

      - name: Install Redis CLI
        run: |
          sudo tailscale set --ssh
          sudo apt-get update
          sudo apt-get install --yes redis-tools jq

      - name: Discover Kafka brokers
        shell: bash
        run: |
          set -euo pipefail

          echo "Discovering redis-server-ts..."

          redis_host="redis-server-ts"

          while [ -z "$redis_host" ]; do
            redis_host="$(
              tailscale status --json |
              jq -r '
                .Peer[] |
                select(.HostName == "redis-server-ts") |
                .TailscaleIPs[0]
              ' |
              head -n1
            )"

            [ -n "$redis_host" ] || sleep 2
          done

          echo "Redis host: $redis_host"

          until redis-cli -h "$redis_host" ping | grep -qx PONG; do
            sleep 2
          done

          BROKER_1="$(redis-cli -h "$redis_host" GET kafka-worker-1)"
          BROKER_2="$(redis-cli -h "$redis_host" GET kafka-worker-2)"
          BROKER_3="$(redis-cli -h "$redis_host" GET kafka-worker-3)"

          test -n "$BROKER_1"
          test -n "$BROKER_2"
          test -n "$BROKER_3"

          echo "Broker 1: $BROKER_1"
          echo "Broker 2: $BROKER_2"
          echo "Broker 3: $BROKER_3"

          echo "KAFKA_BROKERS=${BROKER_1}:9092,${BROKER_2}:9092,${BROKER_3}:9092" >> "$GITHUB_ENV"

      - name: Create Prometheus configuration
        shell: bash
        run: |
          mkdir -p monitoring

          cat > monitoring/prometheus.yml <<'EOF'
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          scrape_configs:

            - job_name: kafka-exporter
              static_configs:
                - targets:
                    - kafka-exporter:9308
          EOF

      - name: Create Grafana provisioning
        shell: bash
        run: |
          mkdir -p monitoring/grafana/provisioning/datasources
          mkdir -p monitoring/grafana/provisioning/dashboards
          mkdir -p monitoring/grafana/dashboards

          cat > monitoring/grafana/provisioning/datasources/prometheus.yml <<'EOF'
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: false
          EOF

          cat > monitoring/grafana/provisioning/dashboards/kafka.yml <<'EOF'
          apiVersion: 1

          providers:
            - name: Kafka
              orgId: 1
              folder: Kafka
              type: file
              disableDeletion: false
              editable: false
              options:
                path: /var/lib/grafana/dashboards
          EOF

      - name: Create Kafka dashboard
        shell: bash
        run: |
          cat > monitoring/grafana/dashboards/kafka.json <<'EOF'
          {
            "annotations": {
              "list": []
            },
            "editable": false,
            "graphTooltip": 1,
            "panels": [
              {
                "type": "stat",
                "title": "Total Messages",
                "gridPos": {
                  "h": 4,
                  "w": 8,
                  "x": 0,
                  "y": 0
                },
                "targets": [
                  {
                    "expr": "sum(kafka_topic_partition_current_offset)",
                    "legendFormat": "Messages",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Consumer Lag",
                "gridPos": {
                  "h": 4,
                  "w": 8,
                  "x": 8,
                  "y": 0
                },
                "targets": [
                  {
                    "expr": "sum(kafka_consumergroup_lag)",
                    "legendFormat": "Lag",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "stat",
                "title": "Message Throughput",
                "gridPos": {
                  "h": 4,
                  "w": 8,
                  "x": 16,
                  "y": 0
                },
                "targets": [
                  {
                    "expr": "sum(rate(kafka_topic_partition_current_offset[1m]))",
                    "legendFormat": "messages/sec",
                    "refId": "A"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "ops"
                  }
                }
              },
              {
                "type": "timeseries",
                "title": "Messages / Second",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 4
                },
                "targets": [
                  {
                    "expr": "sum by (topic) (rate(kafka_topic_partition_current_offset[1m]))",
                    "legendFormat": "{{topic}}",
                    "refId": "A"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "ops"
                  }
                }
              },
              {
                "type": "timeseries",
                "title": "Consumer Group Lag",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 4
                },
                "targets": [
                  {
                    "expr": "sum by (consumergroup) (kafka_consumergroup_lag)",
                    "legendFormat": "{{consumergroup}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Partition Offsets",
                "gridPos": {
                  "h": 8,
                  "w": 24,
                  "x": 0,
                  "y": 12
                },
                "targets": [
                  {
                    "expr": "sum by (topic) (kafka_topic_partition_current_offset)",
                    "legendFormat": "{{topic}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Consumer Group Details",
                "gridPos": {
                  "h": 8,
                  "w": 24,
                  "x": 0,
                  "y": 20
                },
                "targets": [
                  {
                    "expr": "kafka_consumergroup_lag",
                    "format": "table",
                    "instant": true,
                    "refId": "A"
                  }
                ]
              }
            ],
            "schemaVersion": 39,
            "tags": [
              "kafka",
              "ci",
              "github-actions"
            ],
            "templating": {
              "list": []
            },
            "time": {
              "from": "now-15m",
              "to": "now"
            },
            "timezone": "browser",
            "title": "Kafka Cluster Monitoring",
            "uid": "kafka-cluster"
          }
          EOF

      - name: Start Kafka exporter
        shell: bash
        run: |
          docker run \
            --detach \
            --name kafka-exporter \
            --restart unless-stopped \
            --network host \
            danielqsj/kafka-exporter:latest \
            --kafka.server="${KAFKA_BROKERS%%,*}" \
            --kafka.server="${KAFKA_BROKERS#*,}" \
            --web.listen-address=0.0.0.0:9308

      - name: Start Prometheus
        shell: bash
        run: |
          docker run \
            --detach \
            --name prometheus \
            --restart unless-stopped \
            --network host \
            --volume "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:latest \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/prometheus

      - name: Start Grafana
        shell: bash
        run: |
          docker run \
            --detach \
            --name grafana \
            --restart unless-stopped \
            --network host \
            --env GF_SECURITY_ADMIN_USER=admin \
            --env GF_SECURITY_ADMIN_PASSWORD=admin \
            --env GF_AUTH_ANONYMOUS_ENABLED=true \
            --env GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer \
            --volume "$PWD/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            --volume "$PWD/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            grafana/grafana:latest

      - name: Wait for Grafana
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              echo "Grafana is ready."
              break
            fi

            sleep 2
          done

      - name: Print Grafana URL
        shell: bash
        run: |
          MONITORING_IP="$(tailscale ip -4)"

          echo "=============================================="
          echo "Kafka monitoring is available at:"
          echo "http://${MONITORING_IP}:3000/d/kafka-cluster/kafka-cluster"
          echo "=============================================="

          echo "Grafana IP: $MONITORING_IP"

      - name: Keep monitoring online
        shell: bash
        run: |
          echo "Kafka monitoring is running."

          #while true; do
          sleep 100
          #done

  # ================================================================
  # NEW: PYTHON CONSUMER
  # ================================================================
  python-consumer:
    name: Python consumer
    runs-on: ubuntu-24.04
  
    needs: verify-kafka-cluster
  
    steps:
      - name: Connect consumer to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: python-consumer
  
      - name: Install Redis and Python
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools python3-pip jq
  
          python3 -m pip install --break-system-packages kafka-python
  
      - name: Run Python consumer
        shell: bash
        run: |
          set -euo pipefail
  
          echo "Discovering redis-server-ts..."
  
          redis_host=""
  
          while [ -z "$redis_host" ]; do
            redis_host="$(
              tailscale status --json |
              jq -r '
                .Peer[] |
                select(.HostName == "redis-server-ts") |
                .TailscaleIPs[0]
              ' |
              head -n1
            )"
  
            if [ -z "$redis_host" ]; then
              echo "redis-server-ts not available yet..."
              sleep 2
            fi
          done
  
          echo "Redis host: $redis_host"
  
          echo "Checking Redis connectivity..."
          redis-cli -h "$redis_host" PING
  
          echo "Reading Kafka broker addresses from Redis..."
  
          BROKER_1="$(redis-cli -h "$redis_host" GET kafka-worker-1)"
          BROKER_2="$(redis-cli -h "$redis_host" GET kafka-worker-2)"
          BROKER_3="$(redis-cli -h "$redis_host" GET kafka-worker-3)"
  
          if [ -z "$BROKER_1" ]; then
            echo "ERROR: kafka-worker-1 is empty"
            exit 1
          fi
  
          if [ -z "$BROKER_2" ]; then
            echo "ERROR: kafka-worker-2 is empty"
            exit 1
          fi
  
          if [ -z "$BROKER_3" ]; then
            echo "ERROR: kafka-worker-3 is empty"
            exit 1
          fi
  
          echo "Kafka broker 1: $BROKER_1"
          echo "Kafka broker 2: $BROKER_2"
          echo "Kafka broker 3: $BROKER_3"
  
          export KAFKA_BOOTSTRAP_SERVERS="${BROKER_1}:9092,${BROKER_2}:9092,${BROKER_3}:9092"
  
          echo "Kafka bootstrap servers: $KAFKA_BOOTSTRAP_SERVERS"
  
          python3 <<'PY'
          import os
  
          from kafka import KafkaConsumer
  
          TOPIC = "github-actions-test"
  
          bootstrap_servers = os.environ["KAFKA_BOOTSTRAP_SERVERS"].split(",")
  
          print(f"Connecting to Kafka: {bootstrap_servers}")
  
          consumer = KafkaConsumer(
              TOPIC,
              bootstrap_servers=bootstrap_servers,
              auto_offset_reset="earliest",
              enable_auto_commit=True,
              group_id="github-actions-consumer",
          )
  
          print("Consumer started.")
          print("Waiting for 10 messages...")
  
          count = 0
  
          for message in consumer:
              value = (
                  message.value.decode()
                  if message.value is not None
                  else None
              )
  
              key = (
                  message.key.decode()
                  if message.key is not None
                  else None
              )
  
              print(
                  f"CONSUMED: "
                  f"partition={message.partition} "
                  f"offset={message.offset} "
                  f"key={key} "
                  f"value={value}"
              )
  
              count += 1
  
              if count >= 10:
                  break
  
          consumer.close()
  
          print("Consumer finished. Consumed 10 messages.")
          PY

