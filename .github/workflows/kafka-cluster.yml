name: Kafka cluster across GitHub-hosted runners

on:
  workflow_dispatch:

# Every job below runs on a different GitHub-hosted VM. Tailscale supplies the
# private network that lets the Kafka processes communicate between those VMs.
permissions:
  contents: read

env:
  KAFKA_IMAGE: apache/kafka:3.9.0
  # This value must be identical on every KRaft node in a cluster.
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

jobs:
  redis-service:
    name: Redis lifecycle coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Connect Redis to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: redis-server

      - name: Register the Redis coordinator
        run: docker exec ${{ job.services.redis.id }} redis-cli SET redis-service ready

      - name: Keep Redis online until verification finishes
        shell: bash
        run: |
          while [ "$(docker exec ${{ job.services.redis.id }} redis-cli GET redis-service)" = "ready" ]; do
            sleep 2
          done

  check-redis-service:
    name: Check Redis service
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: redis-checker

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Wait for Redis
        shell: bash
        run: |
          MAX_RETRIES=60
          COUNT=0
          REDIS_HOST=""

          while true; do
            REDIS_HOST="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            if [ -n "$REDIS_HOST" ]; then
              echo "Checking Redis at ${REDIS_HOST}:6379..."
              RESPONSE="$(redis-cli -h "$REDIS_HOST" -p 6379 ping 2>/dev/null || true)"
              if [ "$RESPONSE" = "PONG" ]; then
                echo "Redis is available."
                break
              fi
            fi

            COUNT=$((COUNT + 1))
            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Timeout waiting for Redis."
              exit 1
            fi
            echo "Redis is not available yet. ($COUNT/$MAX_RETRIES)"
            sleep 2
          done

  kafka-manager:
    name: Kafka manager (KRaft controller)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-redis-service

    steps:
      - name: Connect the manager to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-manager

      - name: Install the Redis client
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Start the KRaft controller
        shell: bash
        run: |
          redis_host=""
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          until redis-cli -h "$redis_host" ping | grep -qx PONG; do sleep 2; done
          manager_ip="$(tailscale ip -4)"
          redis-cli -h "$redis_host" SET kafka-manager-ip "$manager_ip"

          docker run --detach --name kafka-manager --restart unless-stopped \
            --network host \
            --env CLUSTER_ID \
            --env KAFKA_NODE_ID=1 \
            --env KAFKA_PROCESS_ROLES=controller \
            --env KAFKA_LISTENERS=CONTROLLER://:9093 \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS="1@${manager_ip}:9093" \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_LOG_DIRS=/tmp/kraft-controller-logs \
            "$KAFKA_IMAGE"

      - name: Wait for the controller quorum
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec kafka-manager /opt/kafka/bin/kafka-metadata-quorum.sh \
              --bootstrap-controller localhost:9093 describe --status; then
              exit 0
            fi
            sleep 2
          done
          docker logs kafka-manager
          exit 1

      - name: Register manager and wait for verification
        shell: bash
        run: |
          redis_host=""
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          manager_ip="$(tailscale ip -4)"
          redis-cli -h "$redis_host" SET kafka-manager "$manager_ip"
          while [ -n "$(redis-cli -h "$redis_host" GET kafka-manager)" ]; do
            sleep 2
          done

  check-kafka-manager:
    name: Check Kafka manager
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-manager-checker

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Wait for the Kafka manager
        shell: bash
        run: |
          MAX_RETRIES=120
          COUNT=0
          REDIS_HOST=""

          while [ -z "$REDIS_HOST" ]; do
            REDIS_HOST="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$REDIS_HOST" ] || sleep 2
          done

          while true; do
            MANAGER_IP="$(redis-cli -h "$REDIS_HOST" GET kafka-manager-ip 2>/dev/null || true)"
            if [ -n "$MANAGER_IP" ] && timeout 2 bash -c "</dev/tcp/${MANAGER_IP}/9093"; then
              echo "Kafka manager is reachable at ${MANAGER_IP}:9093."
              break
            fi

            COUNT=$((COUNT + 1))
            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Timeout waiting for the Kafka manager."
              exit 1
            fi
            echo "Kafka manager is not available yet. ($COUNT/$MAX_RETRIES)"
            sleep 2
          done

  kafka-worker-1:
    name: Kafka worker 1 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-manager
    steps: &worker_steps
      - name: Connect the worker to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-worker-1

      - name: Install the Redis client
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Start broker, register it, and wait for verification
        shell: bash
        run: |
          broker_name="${{ github.job }}"
          # Node ID 1 belongs to the KRaft controller; broker IDs must be
          # unique across the complete cluster.
          node_id="$(( ${broker_name##*-} + 1 ))"
          redis_host=""
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          until redis-cli -h "$redis_host" ping | grep -qx PONG; do sleep 2; done
          until [ -n "$(redis-cli -h "$redis_host" GET kafka-manager-ip)" ]; do sleep 2; done
          controller_ip="$(redis-cli -h "$redis_host" GET kafka-manager-ip)"
          worker_ip="$(tailscale ip -4)"

          docker run --detach --name "$broker_name" --restart unless-stopped \
            --network host \
            --env CLUSTER_ID \
            --env KAFKA_NODE_ID="$node_id" \
            --env KAFKA_PROCESS_ROLES=broker \
            --env KAFKA_LISTENERS=PLAINTEXT://:9092 \
            --env KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${worker_ip}:9092" \
            --env KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            --env KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            --env KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            --env KAFKA_CONTROLLER_QUORUM_VOTERS="1@${controller_ip}:9093" \
            --env KAFKA_LOG_DIRS=/tmp/kraft-broker-logs \
            --env KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
            --env KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
            --env KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
            --env KAFKA_MIN_INSYNC_REPLICAS=2 \
            "$KAFKA_IMAGE"

          broker_ready=false
          for attempt in {1..120}; do
            if docker exec "$broker_name" /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092; then
              broker_ready=true
              break
            fi
            sleep 2
          done
          if [ "$broker_ready" != true ]; then
            docker logs "$broker_name"
            exit 1
          fi

          redis-cli -h "$redis_host" SET "$broker_name" "$worker_ip"
          while [ -n "$(redis-cli -h "$redis_host" GET "$broker_name")" ]; do
            sleep 2
          done

  kafka-worker-2:
    name: Kafka worker 2 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-manager
    steps: *worker_steps

  kafka-worker-3:
    name: Kafka worker 3 (broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-kafka-manager
    steps: *worker_steps

  verify-kafka-cluster:
    name: Verify Kafka cluster and release jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Connect the verifier to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: kafka-verifier

      - name: Install Redis and Kafka clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools kcat

      - name: Wait for every Kafka node to register
        shell: bash
        run: |
          required_keys=(redis-service kafka-manager kafka-worker-1 kafka-worker-2 kafka-worker-3)
          redis_host=""
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          until redis-cli -h "$redis_host" ping | grep -qx PONG; do sleep 2; done

          while true; do
            ready=0
            for key in "${required_keys[@]}"; do
              ready=$((ready + $(redis-cli -h "$redis_host" EXISTS "$key")))
            done
            [ "$ready" -eq "${#required_keys[@]}" ] && break
            sleep 2
          done

      - name: Ping the Kafka cluster
        shell: bash
        run: |
          redis_host=""
          until [ -n "$redis_host" ]; do
            redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
            [ -n "$redis_host" ] || sleep 2
          done
          for broker in kafka-worker-1 kafka-worker-2 kafka-worker-3; do
            broker_ip="$(redis-cli -h "$redis_host" GET "$broker")"
            kcat -b "${broker_ip}:9092" -L
          done

      - name: Remove lifecycle keys and finish all jobs
        if: always()
        shell: bash
        run: |
          redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server") | .TailscaleIPs[0]' | head -n1)"
          redis-cli -h "$redis_host" DEL \
            redis-service kafka-manager kafka-manager-ip \
            kafka-worker-1 kafka-worker-2 kafka-worker-3
